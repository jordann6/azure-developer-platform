# Flux Kustomizations that apply the Crossplane configuration (provider, IRSA-
# equivalent workload-identity ProviderConfig, StorageAccount API) and the
# Kyverno policies. Flux applies server-side and retries, so resources whose
# CRDs appear later (e.g. ProviderConfig after the provider package installs)
# converge on their own.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-config
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./platform/crossplane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./platform/kyverno
