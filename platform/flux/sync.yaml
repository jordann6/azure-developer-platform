# Flux entrypoint. Applied once during bootstrap; Flux then reconciles
# everything under platform/flux/apps from this Git repo.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/jordann6/azure-developer-platform
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./platform/flux/apps
